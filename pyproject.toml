[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-card-fraud-anomaly-detection"
version = "1.0.0"
description = "Time-ordered credit-card fraud anomaly detection with operational alert evaluation"
requires-python = ">=3.11"
dependencies = [
  "pandas==2.3.3",
  "numpy==2.3.3",
  "scikit-learn==1.7.2",
  "matplotlib==3.10.6",
]

[project.optional-dependencies]
dev = ["nbformat==5.10.4", "nbclient==0.10.2", "jupyter==1.1.1", "pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

